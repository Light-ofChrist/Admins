<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Pro - Light Of Christ</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #0088cc; --bg-gray: #f4f7f6; --card-shadow: 0 4px 12px rgba(0,0,0,0.1); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); padding: 10px; text-align: center; margin: 0; min-height: 100vh; }
        .blurred-part { background: #222; color: transparent !important; filter: blur(6px); border-radius: 4px; cursor: pointer; transition: 0.3s; }
        #blurTool { display: none; position: absolute; background: #1a1a1a; color: white; padding: 10px 18px; border-radius: 25px; font-size: 13px; z-index: 2000; cursor: pointer; border: 1px solid var(--main-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
        .pass-container { position: relative; width: 85%; max-width: 320px; margin-bottom: 15px; }
        #loginOverlay input { padding: 18px; border-radius: 15px; border: none; width: 100%; text-align: center; font-size: 16px; box-sizing: border-box; }
        .toggle-pass { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 18px; }
        #loginBtn { padding: 15px 50px; border-radius: 12px; border: none; background: #1a1a1a; color: white; cursor: pointer; font-weight: bold; }
        #adminContent { display: none; max-width: 1200px; margin: auto; padding-top: 10px; }
        .stats-bar { background: #333; color: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center; position: sticky; top: 5px; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .admin-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; text-align: right; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 15px; box-shadow: var(--card-shadow); position: relative; transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease; max-height: 1000px; overflow: hidden; opacity: 1; }
        .removing { opacity: 0; transform: scale(0.9) translateX(-20px); max-height: 0; margin-bottom: 0; padding: 0; pointer-events: none; }
        .method-tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; color: white; margin-bottom: 8px; font-weight: bold; }
        .tag-tg { background: #0088cc; } .tag-mail { background: #28a745; } .tag-noreply { background: #6c757d; }
        .time-tag { font-size: 10px; color: #777; float: left; margin-top: 5px; background: #eee; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .btn-reply { background: #28a745; color: white; border: none; padding: 12px; border-radius: 10px; flex: 2; font-weight: bold; cursor: pointer; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; margin-right: 5px; cursor: pointer; }
        .btn-delete-small { background: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-share { background: #f39c12; color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; margin-right: 5px; cursor: pointer; font-size: 18px; }
        .tab-btn { padding: 12px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 10px; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: var(--main-blue); color: white; }
        .hidden { display: none !important; }
        .status-toggle { padding: 8px 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .status-open { background: #28a745; color: white; }
        .status-closed { background: #dc3545; color: white; }
        .sort-btn { background: #6c757d; color: white; }
        .sort-btn.active { background: #495057; }
        .move-cat { background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .multi-select { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; cursor: pointer; z-index: 10; }
        .multi-actions { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; padding: 10px 20px; border-radius: 15px; z-index: 1000; display: none; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .selected-card { border: 3px solid var(--main-blue) !important; box-shadow: 0 0 15px rgba(0,136,204,0.3) !important; }
        .user-select-checkbox { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; cursor: pointer; z-index: 10; }
        .user-card-wrapper { position: relative; }
        .reading-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 4000; }
        #readingsList { max-height: 65vh; overflow-y: auto; padding-right: 5px; }
        #readingsList::-webkit-scrollbar { width: 8px; }
        #readingsList::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        #readingsList::-webkit-scrollbar-thumb { background: var(--main-blue); border-radius: 4px; }
        .user-summary { cursor: pointer; transition: background 0.2s; }
        .user-summary:hover { background: #f0f8ff; }
        .user-details { display: none; padding: 10px 15px; background: #fafafa; border-top: 1px solid #e0e0e0; border-radius: 0 0 10px 10px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .user-details.open { display: block; max-height: 400px; overflow-y: auto; }
        .user-details.open::-webkit-scrollbar { width: 6px; }
        .user-details.open::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        .user-details.open::-webkit-scrollbar-thumb { background: var(--main-blue); border-radius: 3px; }
        .quiz-answer { background: #fff3cd; border-right: 3px solid #f39c12; padding: 6px 10px; margin: 4px 0 8px 0; border-radius: 6px; font-size: 12px; color: #856404; }
        .merged-reading { background: #e8f5e9; border-right: 3px solid #28a745; padding: 8px 12px; margin: 6px 0; border-radius: 8px; font-size: 12px; }
        .merged-reading .count-badge { background: #28a745; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 8px; }
        .single-reading { background: white; border-right: 2px solid #ddd; padding: 6px 10px; margin: 4px 0; border-radius: 6px; font-size: 12px; }
        .user-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; }
        .user-stats { display: flex; gap: 10px; font-size: 12px; color: #555; }
        .stat-pill { background: #e3f2fd; padding: 2px 8px; border-radius: 10px; }
        .expand-icon { transition: transform 0.3s; font-size: 14px; color: #666; }
        .expand-icon.rotated { transform: rotate(180deg); }
        .reading-popup-content { background: white; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%; text-align: right; }
        .reading-popup input, .reading-popup select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 15px; }
    </style>
<base target="_blank">
</head>
<body onmousedown="hideBlurTool()">

    <div id="blurTool" onmousedown="applyBlurToSelection(event)"><i class="fas fa-eye-slash"></i> تشويش النص</div>

    <div id="loginOverlay">
        <h2 style="color: white; margin-bottom: 25px;">🔒 دخول الإدارة</h2>
        <div class="pass-container">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <i class="fas fa-eye toggle-pass" onclick="togglePassView()"></i>
        </div>
        <button id="loginBtn" onclick="checkLogin()">دخول آمن</button>
    </div>

    <div id="adminContent">
        <div class="stats-bar">
            <span>📥 الأسئلة: <b id="qCount">0</b></span>
            <span>📖 القراءات: <b id="readCount">0</b></span>
            <button id="toggleServiceBtn" class="status-toggle" onclick="toggleService()">تحميل...</button>
            <button id="toggleQuestionTimerBtn" class="status-toggle" onclick="toggleQuestionTimer()">⏱️التايمر</button>
            <span>📜 الردود: <b id="rCount">0</b></span>
        </div>

        <div style="margin-bottom: 15px;">
            <button class="tab-btn active" id="tabMainBtn" onclick="showTab('main')">🖥️ اللوحة</button>
            <button id="tabReadingsBtn" class="tab-btn" onclick="showTab('readings')">📖 القراءات</button>
            <button id="logsTabBtn" class="tab-btn hidden" onclick="showTab('logs')">🚨 الأمان</button>
            <button onclick="logout()" style="background: #666; color: white;" class="tab-btn">🚪 خروج</button>
        </div>

        <div style="margin-bottom: 15px; display: flex; justify-content: center; flex-wrap: wrap;">
            <button class="tab-btn active" onclick="filterByCat('الكل', this)">الكل</button>
            <button class="tab-btn" onclick="filterByCat('دراسة', this)">دراسة</button>
            <button class="tab-btn" onclick="filterByCat('صلاة', this)">صلاة</button>
            <button class="tab-btn" onclick="filterByCat('نصائح', this)">نصائح</button>
            <button class="tab-btn" onclick="filterByCat('مشاكل', this)">مشاكل</button>
        </div>

        <div id="multiActionsBar" class="multi-actions">
            <button class="tab-btn" style="background: #dc3545; color: white;" onclick="deleteMultiSelected()">🗑️ حذف الكل</button>
            <button class="tab-btn" style="background: #f39c12; color: white;" onclick="shareMultiSelected()">📷 مشاركة الكل</button>
            <button class="tab-btn" style="background: #6c757d; color: white;" onclick="clearMultiSelect()">❌ إلغاء</button>
        </div>
        <div id="userMultiActionsBar" class="multi-actions">
            <button class="tab-btn" style="background: #dc3545; color: white;" onclick="deleteSelectedUsers()">🗑️ مسح المحددين</button>
            <button class="tab-btn" style="background: #6c757d; color: white;" onclick="clearUserMultiSelect()">❌ إلغاء</button>
        </div>

        <div id="mainTab" class="admin-grid">
            <div id="questionsCol">
                <div style="display: flex; justify-content: space-between; align-items: center; background:#fff; padding:5px 10px; border-radius:10px; margin-bottom:10px;">
                    <h3 style="margin:0">📥 الأسئلة الواردة</h3>
                    <button class="tab-btn" style="font-size: 12px;" onclick="toggleSort()">🔄 <span id="sortLabel">الأحدث أولاً</span></button>
                </div>
                <div id="questionsList">جاري جلب الأسئلة...</div>
                <button id="loadMoreBtn" class="tab-btn" style="width:100%; background:var(--main-blue); color:white; margin-top:10px;" onclick="loadNextPage()">عرض المزيد من الأسئلة ➕</button>
            </div>
            <div id="historyCol">
                <h3 style="margin-top:0">📜 سجل الردود</h3>
                <div id="historyList"></div>
            </div>
        </div>

        <div id="readingsTab" class="hidden">
            <div style="margin-bottom: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 5px;">
                <span style="font-weight: bold; padding: 10px;">الفرز:</span>
                <button class="tab-btn sort-btn active" id="sortAlpha" onclick="changeSort('alpha')">🔤 أبجدي</button>
                <button class="tab-btn sort-btn" id="sortCoins" onclick="changeSort('coins')">🪙 العملات</button>
                <button class="tab-btn sort-btn" id="sortReadings" onclick="changeSort('readings')">📚 القراءات</button>
                <button class="tab-btn sort-btn" id="sortDirBtn" onclick="toggleSortDir()" title="عكس اتجاه الترتيب">⬇️ عكس</button>
            </div>
            <div class="card" style="text-align: right;">
                <h3>📖 سجل القراءات</h3>
                <div id="readingsList"></div>
            </div>
        </div>

        <div id="logsTab" class="hidden">
            <div class="card" style="text-align: right;">
                <h3>🕵️ سجل الدخول الفريد (Unique IPs)</h3>
                <div id="logsList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc, addDoc, serverTimestamp, getDocs, where, getDoc, setDoc, limit, startAfter, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHODkkq-DF_u1KFPhd-K-Ya1yhGDcS2WE",
            authDomain: "esaalny-3588e.firebaseapp.com",
            projectId: "esaalny-3588e",
            storageBucket: "esaalny-3588e.firebasestorage.app",
            messagingSenderId: "532010630852",
            appId: "1:532010630852:web:79e5931fa0b2ff217f1391"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        emailjs.init("ezEIpgi7PHlkP22mm");

        const PASS_ADMIN = "Light-of-Christ", PASS_SUPER = "Makarios-2026";
        let lastVisibleDoc = null;
        let currentSort = "desc";
        let currentSortType = "time";
        let userIP = "unknown";
        let unsubQuestions = null;
        let allQuestionsData = [];
        let selectedQuestions = new Set();
        let questionTimerEnabled = true;
        let allReadingsData = [];
        let currentReadingsSort = 'alpha';
        let currentReadingsDir = 'desc';
        let usersData = {}; // userName -> { coins, readingCount }
        let selectedUsers = new Set();

        async function initSecurity() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
                const q = query(collection(db, "blocked_ips"), where("ip", "==", userIP));
                const snap = await getDocs(q);
                if (!snap.empty) document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>❌ محظور نهائياً</h1>";
            } catch(e) {}
        }
        initSecurity();

        window.togglePassView = () => {
            const p = document.getElementById('passInput');
            p.type = p.type === 'password' ? 'text' : 'password';
        };

        window.checkLogin = async () => {
            const input = document.getElementById('passInput').value.trim();
            let role = input === PASS_SUPER ? "super" : (input === PASS_ADMIN ? "admin" : "none");

            if (role !== "none") {
                await addDoc(collection(db, "admin_login_logs"), { ip: userIP, pass: input, status: role, timestamp: serverTimestamp() });
                localStorage.setItem("adminAuth", "true");
                localStorage.setItem("adminRole", role);
                unlockAdmin(role);
            } else {
                alert("❌ خطأ في كلمة المرور!");
            }
        };

        if (localStorage.getItem("adminAuth") === "true") {
            setTimeout(() => unlockAdmin(localStorage.getItem("adminRole")), 100);
        }

        async function unlockAdmin(role) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            if (role === "super") document.getElementById('logsTabBtn').classList.remove('hidden');

            const timerDoc = await getDoc(doc(db, "settings", "question_timer"));
            questionTimerEnabled = timerDoc.exists() ? timerDoc.data().enabled : true;
            updateQuestionTimerBtnUI();

            loadQuestions(false);
            startLiveUpdates();
        }

        async function loadQuestions(append = false) {
            const qList = document.getElementById('questionsList');
            const loadBtn = document.getElementById('loadMoreBtn');

            if (!append && qList.children.length === 0) {
                qList.innerHTML = "<div style='padding:20px; color:#666;'>⚡ جاري التحميل السريع...</div>";
            }

            let q;
            if (append && lastVisibleDoc) {
                loadBtn.innerText = "جاري جلب المزيد...";
                q = query(collection(db, "questions"), orderBy("timestamp", currentSort), startAfter(lastVisibleDoc), limit(10));
                const snap = await getDocs(q);
                if (snap.empty) { loadBtn.innerText = "نهاية الأسئلة"; return; }
                lastVisibleDoc = snap.docs[snap.docs.length - 1];
                snap.forEach(d => {
                    allQuestionsData.push({ id: d.id, data: d.data() });
                    renderSingleCard(d, qList, true);
                });
                loadBtn.innerText = "عرض المزيد من الأسئلة ➕";
                applyCurrentSort();
                return;
            }

            if (unsubQuestions) unsubQuestions();

            q = query(collection(db, "questions"), orderBy("timestamp", currentSort), limit(20));
            const firstSnap = await getDocs(q);

            allQuestionsData = [];
            if (firstSnap.empty) {
                qList.innerHTML = "لا توجد أسئلة حالياً";
            } else {
                qList.innerHTML = ""; 
                firstSnap.forEach(d => {
                    allQuestionsData.push({ id: d.id, data: d.data() });
                    renderSingleCard(d, qList, true);
                });
                lastVisibleDoc = firstSnap.docs[firstSnap.docs.length - 1];
            }

            unsubQuestions = onSnapshot(q, (snap) => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        if (!document.getElementById(`q-${change.doc.id}`)) {
                            allQuestionsData.push({ id: change.doc.id, data: change.doc.data() });
                            renderSingleCard(change.doc, qList, false);
                            if (qList.innerHTML.includes("لا توجد أسئلة")) qList.innerHTML = "";
                            applyCurrentSort();
                        }
                    }
                    if (change.type === "removed") {
                        const el = document.getElementById(`q-${change.doc.id}`);
                        if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 400); }
                        allQuestionsData = allQuestionsData.filter(item => item.id !== change.doc.id);
                    }
                    if (change.type === "modified") {
                        const idx = allQuestionsData.findIndex(item => item.id === change.doc.id);
                        if (idx !== -1) allQuestionsData[idx].data = change.doc.data();
                        const el = document.getElementById(`q-${change.doc.id}`);
                        if (el) {
                            const data = change.doc.data();
                            const catTag = el.querySelector('.cat-tag');
                            if (catTag && data.category) catTag.innerText = data.category;
                        }
                    }
                });
            });
        }

        window.renderSingleCard = function(d, container, isAppend) {
            if (document.getElementById(`q-${d.id}`)) return;
            const data = d.data();
            const timeStr = data.timestamp?.toDate().toLocaleString('ar-EG', { weekday: 'long', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) || "..";
            const category = data.category || getCategory(data.question);

            let methodClass = 'tag-noreply';
            if (data.replyMethod === 'telegram') methodClass = 'tag-tg';
            else if (data.replyMethod === 'email') methodClass = 'tag-mail';

            const html = `
                <div class="card" id="q-${d.id}" data-cat="${category}">
                    <input type="checkbox" class="multi-select" onchange="toggleMultiSelect('${d.id}', this)" title="اختيار للحذف/المشاركة">
                    <span class="method-tag ${methodClass}">${data.replyMethod === 'noreply' ? 'بدون رد' : data.replyMethod}</span>
                    <span class="cat-tag" style="display:inline-block; padding:3px 8px; border-radius:4px; background:#e9ecef; font-size:11px; margin-right:5px;">${category}</span>
                    <span class="time-tag">${timeStr}</span>
                    <p style="clear:both; padding-top:10px; user-select: text; text-align:right; font-size:15px; line-height:1.6;" class="question-text">${data.question}</p>
                    <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;">
                        <button class="btn-reply" onclick="handleReply('${data.chatId || ''}','${data.userEmail || ''}','${data.question.replace(/'/g, "\'")}','${d.id}','${data.replyMethod}')">رد</button>
                        <button class="btn-share" onclick="shareNGL('${d.id}')">📷</button>
                        <button class="btn-share" onclick="shareBlurred('${d.id}')" style="background:#6c757d;" title="مشاركة مشوشة">👁️</button>
                        <button class="move-cat" onclick="moveCategory('${d.id}')">🏷️ نقل</button>
                        <button class="btn-delete" onclick="triggerDelete('${d.id}','questions')">حذف</button>
                    </div>
                </div>`;
            if (isAppend) container.insertAdjacentHTML('beforeend', html);
            else container.insertAdjacentHTML('afterbegin', html);
        }

        function startLiveUpdates() {
            onSnapshot(collection(db, "questions"), s => document.getElementById('qCount').innerText = s.size);
            onSnapshot(collection(db, "replies_history"), s => document.getElementById('rCount').innerText = s.size);
            onSnapshot(collection(db, "readings"), s => document.getElementById('readCount').innerText = s.size);

            onSnapshot(query(collection(db, "replies_history"), orderBy("timestamp", "desc"), limit(10)), snap => {
                const hList = document.getElementById('historyList'); hList.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    hList.innerHTML += `<div class="card" id="h-${d.id}" style="font-size:13px; border-right:3px solid var(--main-blue);">
                        <b>س:</b> ${data.q}<br><b>ج:</b> ${data.r}
                        <button class="btn-delete" style="padding:4px; font-size:11px; width:100%; margin-top:8px;" onclick="triggerDelete('${d.id}','replies_history')">حذف من السجل</button>
                    </div>`;
                });
            });

            onSnapshot(doc(db, "settings", "service_status"), d => {
                const btn = document.getElementById('toggleServiceBtn');
                const closed = d.exists() && d.data().closed;
                btn.innerText = closed ? "🔴 مغلق" : "🟢 مفتوح";
                btn.className = "status-toggle " + (closed ? "status-closed" : "status-open");
            });

            onSnapshot(doc(db, "settings", "question_timer"), d => {
                if (d.exists()) {
                    questionTimerEnabled = d.data().enabled;
                    updateQuestionTimerBtnUI();
                }
            });

            onSnapshot(query(collection(db, "readings"), orderBy("timestamp", "desc"), limit(50)), snap => {
                allReadingsData = [];
                snap.forEach(d => allReadingsData.push({ id: d.id, data: d.data() }));
                renderReadings();
            });

            // Load users data for coins
            onSnapshot(collection(db, "users"), snap => {
                usersData = {};
                snap.forEach(d => {
                    const data = d.data();
                    usersData[d.id] = { coins: data.coins || 0, readingCount: data.readingCount || 0 };
                });
                // Re-render if currently on readings tab
                if (document.getElementById('readingsTab') && !document.getElementById('readingsTab').classList.contains('hidden')) {
                    renderReadings();
                }
            });

            if (localStorage.getItem("adminRole") === "super") {
                onSnapshot(query(collection(db, "admin_login_logs"), orderBy("timestamp", "desc")), snap => {
                    const l = document.getElementById('logsList'); l.innerHTML = "";
                    const uniqueIPs = {};
                    snap.forEach(d => {
                        const data = d.data();
                        if (!uniqueIPs[data.ip]) {
                            uniqueIPs[data.ip] = { count: 1, pass: data.pass };
                            l.innerHTML += `<div class="card" style="font-size:12px">
                                🌐 <b>${data.ip}</b> | محاولات: <span id="c-${data.ip.replace(/\./g,'-')}">1</span>
                                <button class="btn-delete" style="padding:4px 10px; float:left; background:#000;" onclick="banIP('${data.ip}')">حظر</button><br>
                                <small>آخر باسوورد: ${data.pass}</small>
                            </div>`;
                        } else {
                            uniqueIPs[data.ip].count++;
                            const el = document.getElementById(`c-${data.ip.replace(/\./g,'-')}`);
                            if(el) el.innerText = uniqueIPs[data.ip].count;
                        }
                    });
                });
            }
        }

        function updateQuestionTimerBtnUI() {
            const btn = document.getElementById('toggleQuestionTimerBtn');
            if (btn) {
                btn.innerText = questionTimerEnabled ? "⏱️ التايمر : مفعل" : "⏱️ التايمر : معطل";

        window.handleReply = async (cId, mail, q, id, method) => {
            if (method === 'noreply') {
                alert("هذا السؤال بدون رد");
                return;
            }
            const r = prompt("اكتب الرد:");
            if(!r) return;
            try {
                if(method === 'telegram') await fetch(`https://api.telegram.org/bot8326561499:AAF8y3t3Z9v2E2ryLF0gsP_gvRkZNENkmoU/sendMessage?chat_id=${cId}&text=${encodeURIComponent(r)}`);
                if(method === 'email') await emailjs.send("service_kj15z59", "template_5rdomra", { to_email: mail, original_question: q, reply_text: r });
                await addDoc(collection(db, "replies_history"), { q: q, r: r, timestamp: serverTimestamp() });

        window.triggerDelete = async (id, col) => {
            if(!confirm("حذف نهائي؟")) return;
            await deleteDoc(doc(db, col, id));
        };

        window.getCategory = (text) => {
            const t = text.toLowerCase();
            if(t.includes('مذاكرة') || t.includes('دراسة')) return "دراسة";
            if(t.includes('صلاة') || t.includes('صلولي')) return "صلاة";
            if(t.includes('نصيحة') || t.includes('رأيك')) return "نصائح";
            if(t.includes('مشكلة') || t.includes('أهل')) return "مشاكل";
            return "الكل";
        };

        window.filterByCat = (cat, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                if (b.innerText.includes('دراسة') || b.innerText.includes('صلاة') || b.innerText.includes('نصائح') || b.innerText.includes('مشاكل') || b.innerText === 'الكل') {
                    b.classList.remove('active');
                }
            });
            if(btn) btn.classList.add('active');

            const cards = document.querySelectorAll('#questionsList .card');
            cards.forEach(card => {
                if (cat === 'الكل') {
                    card.style.display = 'block';
                } else {
                    const cardCat = card.getAttribute('data-cat') || getCategory(card.querySelector('.question-text').innerText);
                    card.style.display = (cardCat === cat) ? 'block' : 'none';
                }
            });
        };

        window.moveCategory = async (questionId) => {
            const cats = ['دراسة', 'صلاة', 'نصائح', 'مشاكل'];
            const choice = prompt(`اختر التصنيف الجديد:
1. دراسة
2. صلاة
3. نصائح
4. مشاكل`);
            if (!choice) return;
            let newCat = '';
            if (choice === '1') newCat = 'دراسة';
            else if (choice === '2') newCat = 'صلاة';
            else if (choice === '3') newCat = 'نصائح';
            else if (choice === '4') newCat = 'مشاكل';
            else { alert("اختيار غير صحيح"); return; }

            try {
                await updateDoc(doc(db, "questions", questionId), { category: newCat });
                const card = document.getElementById(`q-${questionId}`);
                if (card) {
                    card.setAttribute('data-cat', newCat);
                    const catTag = card.querySelector('.cat-tag');
                    if (catTag) catTag.innerText = newCat;
                }
                alert(`✅ تم نقل السؤال إلى: ${newCat}`);
            } catch(e) {
                alert("حدث خطأ أثناء النقل");
            }
        };

        window.toggleMultiSelect = (id, checkbox) => {
            const card = document.getElementById(`q-${id}`);
            if (checkbox.checked) {
                selectedQuestions.add(id);
                card.classList.add('selected-card');
            } else {
                selectedQuestions.delete(id);
                card.classList.remove('selected-card');
            }
            updateMultiActionsBar();
        };

        function updateMultiActionsBar() {
            const bar = document.getElementById('multiActionsBar');
            bar.style.display = selectedQuestions.size > 0 ? 'flex' : 'none';
        }

        window.clearMultiSelect = () => {
            selectedQuestions.clear();
            document.querySelectorAll('.multi-select').forEach(cb => cb.checked = false);
            document.querySelectorAll('.selected-card').forEach(c => c.classList.remove('selected-card'));
            updateMultiActionsBar();
        };

        window.deleteMultiSelected = async () => {
            if (selectedQuestions.size === 0) return;
            if (!confirm(`حذف ${selectedQuestions.size} سؤال نهائياً؟`)) return;

            let deleted = 0;
            for (const id of selectedQuestions) {
                try {
                    await deleteDoc(doc(db, "questions", id));
                    deleted++;
                } catch(e) { console.error("Error deleting:", id); }
            }
            alert(`✅ تم حذف ${deleted} سؤال`);
            clearMultiSelect();
        };

        window.shareMultiSelected = async () => {

            div.style.cssText = "padding:30px; background:#f4f7f6; width:400px; position:absolute; left:-9999px; z-index:-1;";

                const card = document.getElementById(`q-${id}`);

                    const text = card.querySelector('.question-text').innerText;

                        <p style="font-size:16px; color:#333; margin:0; line-height:1.6;">${text}</p>
                    </div>`;
                }
            });

            div.innerHTML = `
                <div style="text-align:center; margin-bottom:20px;">
                    <h2 style="color:var(--main-blue); margin:0;">Light of Christ</h2>

                </div>
                ${questionsHTML}`;

                const canvas = await html2canvas(div, { backgroundColor: '#f4f7f6', scale: 2 });

                    const file = new File([blob], "questions.png", { type: "image/png" });

                    } else {
                        const link = document.createElement('a');
                        link.download = "questions.png";
                        link.href = canvas.toDataURL("image/png");
                        link.click();

                    document.body.removeChild(div);
                    clearMultiSelect();
                }, "image/png");
            } catch (error) {
                alert("حدث خطأ أثناء إنشاء الصورة");

            }
        };

        window.shareNGL = async (id) => {
            const el = document.querySelector(`#q-${id} .question-text`);
            if(!el) return alert("حدث خطأ، لم يتم العثور على السؤال");

                <div style="background:white; padding:30px; border-radius:20px; box-shadow:0 10px 20px rgba(0,0,0,0.2);">
                    <h3 style="color:#333; font-size:18px; margin-bottom:15px; direction:rtl;">${el.innerText}</h3>

        window.shareBlurred = async (id) => {
            const card = document.getElementById(`q-${id}`);

                <div style="background:white; padding:30px; border-radius:20px; box-shadow:0 10px 20px rgba(0,0,0,0.2); direction:rtl;">

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: 'محتوى مشوش', text: 'Light of Christ' }); } catch(err) {}

                        link.download = "blurred.png";

                        link.click();

                }, "image/png");
            } catch (error) {

                document.body.removeChild(div);
            }
        };

        function groupReadingsByUser() {
            const users = {};
            allReadingsData.forEach(item => {
                const name = (item.data.userName || 'مستخدم').trim();
                const uid = item.data.userId || '';
                if (!users[name]) {
                    users[name] = { items: [], totalCoins: 0, totalReadings: 0, age: item.data.age || '', governorate: item.data.governorate || '', userId: uid };
                }
                users[name].items.push(item);
                users[name].totalReadings += 1;
            });
            // Get real coins from usersData
            Object.values(users).forEach(u => {
                if (u.userId && usersData[u.userId]) {
                    u.totalCoins = usersData[u.userId].coins || 0;
                }
            });
            return users;
        }

        function mergeSimilarReadings(items) {
            const keyMap = {};
            items.forEach(item => {
                const d = item.data;
                const key = `${d.testament || ''}::${d.book || ''}::${d.chapter || ''}::${d.verse || ''}`;
                if (!keyMap[key]) {
                    keyMap[key] = { ...item, count: 1, ids: [item.id] };
                } else {
                    keyMap[key].count += 1;
                    keyMap[key].ids.push(item.id);
                }
            });
            return Object.values(keyMap);
        }

        function sortByNumeric(a, b) {
            // Sort numerically by chapter then verse
            const chA = parseInt(a.data.chapter) || 0;
            const chB = parseInt(b.data.chapter) || 0;
            if (chA !== chB) return chA - chB;
            const vA = parseInt(a.data.verse) || 0;
            const vB = parseInt(b.data.verse) || 0;
            return vA - vB;
        }

        function renderReadings() {
            const rList = document.getElementById('readingsList');
            if (!rList) return;
            rList.innerHTML = "";
            if (allReadingsData.length === 0) {
                rList.innerHTML = "<div style='padding:20px; color:#666;'>لا توجد قراءات بعد</div>";
                return;
            }

            let users = groupReadingsByUser();
            let userEntries = Object.entries(users);

            // Sort users based on current sort
            userEntries.sort((a, b) => {
                let cmp = 0;
                if (currentReadingsSort === 'alpha') {
                    cmp = a[0].localeCompare(b[0], 'ar');
                } else if (currentReadingsSort === 'coins') {
                    cmp = a[1].totalCoins - b[1].totalCoins;
                } else if (currentReadingsSort === 'readings') {
                    cmp = a[1].totalReadings - b[1].totalReadings;
                }
                return currentReadingsDir === 'desc' ? -cmp : cmp;
            });

            userEntries.forEach(([name, userData]) => {
                const safeName = name.replace(/'/g, "\'");
                const ageInfo = userData.age ? ` | العمر: ${userData.age}` : '';
                const govInfo = userData.governorate ? ` | ${userData.governorate}` : '';

                rList.innerHTML += `
                <div class="card user-card-wrapper" id="ucard-${safeName}" style="padding:0; overflow:hidden;">
                    <input type="checkbox" class="user-select-checkbox" onchange="toggleUserSelect('${safeName}', this)" onclick="event.stopPropagation()" title="تحديد للحذف">
                    <div class="user-summary" onclick="toggleUserDetails('${safeName}')">
                        <div style="padding:15px;">
                            <div class="user-header">
                                <div>
                                    <b style="font-size:14px;">👤 ${name}</b>
                                    <span style="color:#888; font-size:11px;">${ageInfo}${govInfo}</span>
                                </div>
                                <div class="user-stats">
                                    <span class="stat-pill">🪙 ${userData.totalCoins}</span>
                                    <span class="stat-pill">📚 ${userData.totalReadings}</span>
                                    <span class="expand-icon" id="icon-${safeName}">▼</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div style="padding:0 15px 10px 15px; text-align:left;">
                        <button class="btn-delete-small" onclick="event.stopPropagation(); deleteUserAllReadings('${safeName}', '${userData.userId || ''}')">🗑️ مسح الاسم بالكامل</button>
                    </div>
                    <div class="user-details" id="details-${safeName}">
                        <div id="inner-${safeName}">جاري التحميل...</div>
                    </div>
                </div>`;
            });
        }

        window.toggleUserDetails = (name) => {
            const details = document.getElementById(`details-${name}`);
            const icon = document.getElementById(`icon-${name}`);
            if (!details) return;

            if (details.classList.contains('open')) {
                details.classList.remove('open');
                icon.classList.remove('rotated');
            } else {
                document.querySelectorAll('.user-details.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.expand-icon.rotated').forEach(el => el.classList.remove('rotated'));

                details.classList.add('open');
                icon.classList.add('rotated');
                renderUserReadings(name);
            }
        };

        function renderUserReadings(name) {
            const inner = document.getElementById(`inner-${name}`);
            if (!inner) return;

            const users = groupReadingsByUser();
            const userData = users[name];
            if (!userData) { inner.innerHTML = 'لا توجد بيانات'; return; }

            const merged = mergeSimilarReadings(userData.items);

            // Always sort inner readings numerically by chapter then verse
            merged.sort((a, b) => {
                let cmp = sortByNumeric(a, b);
                return currentReadingsDir === 'desc' ? -cmp : cmp;
            });

            let html = '';
            merged.forEach(m => {
                const d = m.data;
                const timeStr = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString('ar-EG') : "..";
                const testament = d.testament === 'old' ? 'العهد القديم' : 'العهد الجديد';
                const countBadge = m.count > 1 ? `<span class="count-badge">×${m.count}</span>` : '';

                const quizHtml = d.quizAnswer ? `<div class="quiz-answer">📝 ${d.quizAnswer}</div>` : '';
                html += `<div class="merged-reading">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div><b>📖 ${d.book}</b> - أصحاح ${d.chapter} - آية ${d.verse} ${countBadge}</div>
                        <button class="btn-delete-small" onclick="deleteMergedReadings([${m.ids.map(id => "'"+id+"'").join(',')}])">🗑</button>
                    </div>
                    ${quizHtml}
                    <div style="color:#666; font-size:11px; margin-top:4px;">${testament} | ${timeStr}</div>
                </div>`;
            });

            inner.innerHTML = html || 'لا توجد قراءات';
        }

        window.deleteMergedReadings = async (ids) => {
            if (!confirm(`حذف ${ids.length} قراءة؟`)) return;
            for (const id of ids) {
                try { await deleteDoc(doc(db, "readings", id)); } catch(e) {}
            }
        };

        window.deleteUserAllReadings = async (name, userId) => {
            if (!confirm(`هل أنت متأكد من مسح كل قراءات "${name}" بالكامل؟

⚠️ هذا الإجراء لا يمكن التراجع عنه!`)) return;

            // Find all readings for this user
            const users = groupReadingsByUser();
            const userData = users[name];
            if (!userData || userData.items.length === 0) {
                alert('لا توجد قراءات لهذا المستخدم');
                return;
            }

            let deleted = 0;
            for (const item of userData.items) {
                try {
                    await deleteDoc(doc(db, "readings", item.id));
                    deleted++;
                } catch(e) { console.error('Error deleting:', item.id); }
            }

            // Also delete from users collection if userId exists
            if (userId) {
                try { await deleteDoc(doc(db, "users", userId)); } catch(e) {}
            }

            alert(`✅ تم مسح ${deleted} قراءة لـ "${name}"`);

            // Close details if open
            const details = document.getElementById(`details-${name}`);
            if (details) details.classList.remove('open');
        };

        window.changeSort = (type) => {
            currentReadingsSort = type;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sort${type.charAt(0).toUpperCase() + type.slice(1)}`).classList.add('active');
            renderReadings();
            document.querySelectorAll('.user-details.open').forEach(el => {
                const name = el.id.replace('details-', '');
                renderUserReadings(name);
            });
        };

        window.toggleSortDir = () => {
            currentReadingsDir = currentReadingsDir === 'desc' ? 'asc' : 'desc';
            const btn = document.getElementById('sortDirBtn');
            if (btn) btn.innerText = currentReadingsDir === 'desc' ? '⬇️ عكس' : '⬆️ عكس';
            renderReadings();
            document.querySelectorAll('.user-details.open').forEach(el => {
                const name = el.id.replace('details-', '');
                renderUserReadings(name);
            });
        };

        function applyCurrentSort() {
            const container = document.getElementById('questionsList');
            const cards = Array.from(container.querySelectorAll('.card'));

            if (currentSortType === 'time') return;

            cards.sort((a, b) => {
                if (currentSortType === 'alpha') {
                    const textA = a.querySelector('.question-text').innerText;
                    const textB = b.querySelector('.question-text').innerText;
                    return textA.localeCompare(textB, 'ar');
                }
                if (currentSortType === 'coins') {
                    const coinsA = parseInt(a.querySelector('.user-info-bar')?.innerText.match(/🪙 (\d+)/)?.[1] || 0);
                    const coinsB = parseInt(b.querySelector('.user-info-bar')?.innerText.match(/🪙 (\d+)/)?.[1] || 0);
                    return coinsB - coinsA;
                }
                if (currentSortType === 'readings') {
                    const readA = parseInt(a.querySelector('.user-info-bar')?.innerText.match(/📚 (\d+)/)?.[1] || 0);
                    const readB = parseInt(b.querySelector('.user-info-bar')?.innerText.match(/📚 (\d+)/)?.[1] || 0);
                    return readB - readA;
                }
                return 0;
            });

            cards.forEach(card => container.appendChild(card));
        }

        document.addEventListener('selectionchange', () => {
            const s = window.getSelection();
            if (s.toString().trim().length > 0) {
                const r = s.getRangeAt(0).getBoundingClientRect();
                const t = document.getElementById('blurTool');
                t.style.display = 'block'; t.style.top = `${r.top + window.scrollY - 45}px`; t.style.left = `${r.left + window.scrollX}px`;
            }
        });
        window.hideBlurTool = () => setTimeout(() => document.getElementById('blurTool').style.display = 'none', 300);
        window.applyBlurToSelection = (e) => {
            e.preventDefault();
            const range = window.getSelection().getRangeAt(0);
            const span = document.createElement('span'); span.className = 'blurred-part';
            span.onclick = function() { this.classList.toggle('blurred-part'); };
            range.surroundContents(span);
        };

        window.toggleSort = () => {
            currentSort = currentSort === "desc" ? "asc" : "desc";
            document.getElementById('sortLabel').innerText = currentSort === "desc" ? "الأحدث أولاً" : "الأقدم أولاً";
            lastVisibleDoc = null;
            document.getElementById('questionsList').innerHTML = ""; 
            loadQuestions(false);
        };
        window.loadNextPage = () => loadQuestions(true);
        window.banIP = async (ip) => { if(confirm("حظر هذا الـ IP؟")) await addDoc(collection(db, "blocked_ips"), { ip: ip }); };
        window.showTab = (t) => {
            document.getElementById('mainTab').classList.toggle('hidden', t !== 'main');
            document.getElementById('readingsTab').classList.toggle('hidden', t !== 'readings');
            document.getElementById('logsTab').classList.toggle('hidden', t !== 'logs');
            document.getElementById('tabMainBtn').classList.toggle('active', t === 'main');
            document.getElementById('tabReadingsBtn').classList.toggle('active', t === 'readings');
            document.getElementById('logsTabBtn').classList.toggle('active', t === 'logs');
        };
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.toggleService = async () => {
            const sRef = doc(db, "settings", "service_status");
            const snap = await getDoc(sRef);
            await setDoc(sRef, { closed: snap.exists() ? !snap.data().closed : true });
        };
        window.toggleQuestionTimer = async () => {
            const sRef = doc(db, "settings", "question_timer");
            const snap = await getDoc(sRef);
            const newState = snap.exists() ? !snap.data().enabled : false;
            await setDoc(sRef, { enabled: newState });
            questionTimerEnabled = newState;
            updateQuestionTimerBtnUI();
        };
    </script>
